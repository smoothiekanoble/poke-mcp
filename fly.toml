app = "poke-mcp"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  APP_TIMEZONE = "America/Chicago"
  MCP_HOST = "0.0.0.0"
  MCP_PORT = "8080"
  MCP_PATH = "/mcp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"
