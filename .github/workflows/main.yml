# .github/workflows/deploy-render.yml
name: Deploy to Render

on:
  push:
    branches: [feat/initial-mcp-server]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Add it in GitHub: Settings → Secrets and variables → Actions."
            echo "Value: Render → poke-mcp → Settings → Deploy Hook."
            exit 1
          fi
          curl -fsS "$DEPLOY_HOOK_URL"
