[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poke-mcp"
version = "0.1.0"
description = "Daniel's personal Poke-compatible MCP server for HabitTracker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==3.4.2",
  "pydantic-settings==2.14.1",
  "supabase==2.31.0",
  "tzdata==2026.2",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.16",
]

[project.scripts]
poke-mcp = "poke_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
